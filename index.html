/* KnowsMore — Color System
   Base is screen-smart charcoal + near-white (warm-neutral "paper").
   Color is restrained and contextual. A single accent family carries the
   line-of-business (LOB) identity and is swapped via [data-lob="…"] scopes.
   Nothing in the base UI hardcodes a hue — everything routes through --accent-*. */

:root {
  /* ---- Warm-neutral ink ramp (screen-smart, never pure #000 / #fff) ---- */
  --n-0:   #FFFFFF;
  --n-25:  #FDFCFA;   /* page background — very subtly warm off-white */
  --n-50:  #F4F3EF;   /* sunken surface / zebra rows */
  --n-100: #ECEBE5;   /* subtle fills, hairlines-strong */
  --n-150: #E2E1D9;
  --n-200: #D4D3CB;   /* default borders */
  --n-300: #B7B6AD;   /* placeholder / disabled ink */
  --n-400: #949389;
  --n-500: #74736B;   /* muted text */
  --n-600: #57564F;   /* secondary text */
  --n-700: #3E3D38;
  --n-800: #2A2925;   /* body text */
  --n-900: #1C1B18;   /* strong text — screen-smart charcoal */
  --n-950: #121110;   /* max ink */

  /* ---- KnowsMore violet (system accent, nods to the mascot) ---- */
  --violet-050: #F5F3FB;
  --violet-100: #EAE7F5;
  --violet-200: #D6D0EC;
  --violet-400: #7C71C0;
  --violet-500: #5D51A8;
  --violet-600: #4B3F92;
  --violet-700: #3C317A;

  /* ---- Semantic surfaces ---- */
  --surface-page:    var(--n-25);
  --surface-card:    #FFFFFF;
  --surface-sunken:  var(--n-50);
  --surface-inset:   var(--n-100);
  --surface-ink:     var(--n-900);   /* dark rails / focus mode */
  --surface-ink-2:   var(--n-800);
  --surface-hover:   rgba(28, 27, 24, 0.045);
  --surface-active:  rgba(28, 27, 24, 0.075);
  --surface-scrim:   rgba(250, 249, 246, 0.55);

  /* ---- Semantic text ---- */
  --text-strong:    var(--n-900);
  --text-body:      var(--n-800);
  --text-secondary: var(--n-600);
  --text-muted:     var(--n-500);
  --text-disabled:  var(--n-300);
  --text-inverse:   var(--n-25);
  --text-on-dark:   #F3F1EC;
  --text-on-dark-muted: #B7B4AC;

  /* ---- Semantic borders ---- */
  --border-subtle:  var(--n-100);
  --border-default: var(--n-200);
  --border-strong:  var(--n-300);
  --border-ink:     var(--n-900);

  /* ---- Accent (default LOB = KnowsMore) ---- */
  --accent:          var(--violet-600);
  --accent-hover:    var(--violet-700);
  --accent-strong:   var(--violet-700);
  --accent-ink:      var(--violet-700);  /* accent text on light surfaces */
  --accent-tint:     var(--violet-100);  /* chip / selected row background */
  --accent-tint-2:   var(--violet-050);  /* faint wash */
  --accent-border:   var(--violet-200);
  --accent-contrast: #FFFFFF;            /* text/icon on a filled accent */

  /* ---- Finance variance semantics (editorial, muted — never alarming) ---- */
  --fav:        #3F7A63;   /* favorable: under budget, savings, positive ROI — muted sage, not holiday green */
  --fav-ink:    #28563F;
  --fav-tint:   #E7F1EB;
  --unfav:      #B0563C;   /* unfavorable: over budget, overspend — muted rust, not holiday red */
  --unfav-ink:  #8D4128;
  --unfav-tint: #F7EBE3;
  --warn:       #C0872F;   /* at risk / pending — softened amber, less mustard */
  --warn-ink:   #8A5E12;
  --warn-tint:  #F8F1E1;
  --info:       #2F5AA8;   /* informational */
  --info-ink:   #274C90;
  --info-tint:  #E7EDF7;
  --flat:       var(--n-500);  /* on-track / no variance */

  /* ---- Restrained data-viz ramp (small charts, sparklines) ---- */
  --dv-1: #4B3F92;  /* accent */
  --dv-2: #2F5AA8;
  --dv-3: #3F7A63;
  --dv-4: #A9741A;
  --dv-5: #8A6F9E;
  --dv-6: #5B7C8D;
  --dv-grid: var(--n-150);
  --dv-axis: var(--n-400);

  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent);
}

/* ============================================================
   SINGLE HERO-COLOR MODE  (opt-in, no LOB roster)
   For consumer apps that have no line-of-business identity to carry — they
   just want one flat brand/hero color instead of the 14-scope Disney roster.
   Scope a subtree with data-lob="custom" and set ONE variable, --accent-hero
   (e.g. --accent-hero: #3D4A41), inline or in your own stylesheet. Every
   derived shade (hover, ink, tints, border) is computed automatically via
   color-mix — no palette design required. If the hero color is light, also
   set --accent-hero-contrast (defaults to white). Title moments stay in the
   base UI sans — hero mode intentionally carries no brand-font nod. */
[data-lob="custom"] {
  --accent:          var(--accent-hero, var(--violet-600));
  --accent-hover:    color-mix(in srgb, var(--accent) 84%, black);
  --accent-strong:   color-mix(in srgb, var(--accent) 84%, black);
  --accent-ink:      color-mix(in srgb, var(--accent) 88%, black);
  --accent-tint:     color-mix(in srgb, var(--accent) 13%, white);
  --accent-tint-2:   color-mix(in srgb, var(--accent) 6%, white);
  --accent-border:   color-mix(in srgb, var(--accent) 30%, white);
  --accent-contrast: var(--accent-hero-contrast, #FFFFFF);
  --font-lob-display: var(--font-sans); --lob-display-weight: 600;
  --lob-display-transform: none; --lob-display-tracking: -0.005em;
}

/* Custom properties don't re-substitute on inheritance — --focus-ring was baked
   with --accent's value at :root (violet), so it never followed a [data-lob]
   override further down the tree. Recompute it once, generically, wherever a
   LOB (or the hero-color "custom" scope) is active. */
[data-lob] {
  --focus-ring: 0 0 0 3px color-mix(in srgb, var(--accent) 26%, transparent);
}

/* ============================================================
   DARK THEME  (opt-in)
   Wrap a subtree (usually <html>) in [data-theme="dark"]. Only the
   SEMANTIC layer is remapped — warm charcoal instead of warm paper — so
   every component re-themes for free. Accent stays the true brand hue; its
   tints/ink are re-derived with color-mix so ALL 14 LOB scopes work on dark
   with no per-LOB rewrite. To auto-follow the OS, add the tiny snippet in
   guidelines/theme-dark.html (sets data-theme from prefers-color-scheme).
   ============================================================ */
[data-theme="dark"] {
  /* warm-charcoal surfaces (never pure black) */
  --surface-page:   #171614;
  --surface-card:   #201F1C;
  --surface-sunken: #1A1917;
  --surface-inset:  #262521;
  --surface-ink:    #302E29;   /* raised dark surface — toasts, ⌘K, rails */
  --surface-ink-2:  #3A3833;
  --surface-hover:  rgba(255, 255, 255, 0.055);
  --surface-active: rgba(255, 255, 255, 0.09);
  --surface-scrim:  rgba(8, 7, 6, 0.62);

  /* text — warm off-whites */
  --text-strong:    #F4F2EC;
  --text-body:      #E3E0D8;
  --text-secondary: #B3B0A7;
  --text-muted:     #89867D;
  --text-disabled:  #5B5952;
  --text-inverse:   #171614;
  --text-on-dark:   #F3F1EC;
  --text-on-dark-muted: #B7B4AC;

  /* borders — light-on-dark hairlines */
  --border-subtle:  rgba(255, 255, 255, 0.08);
  --border-default: rgba(255, 255, 255, 0.145);
  --border-strong:  rgba(255, 255, 255, 0.26);
  --border-ink:     #F4F2EC;

  /* accent tints/ink re-derived from the live --accent (works for every LOB) */
  --accent-tint:    color-mix(in srgb, var(--accent) 22%, #201F1C);
  --accent-tint-2:  color-mix(in srgb, var(--accent) 12%, #201F1C);
  --accent-border:  color-mix(in srgb, var(--accent) 42%, transparent);
  --accent-ink:     color-mix(in srgb, var(--accent) 52%, #F4F2EC);

  /* variance — lighter inks on dark washes, tone unchanged */
  --fav:   #509F82; --fav-ink:   #90D2B5; --fav-tint:   #15251C;
  --unfav: #CE8163; --unfav-ink: #EEB7A0; --unfav-tint: #2B1F18;
  --warn:  #CDA35A; --warn-ink:  #EBCF92; --warn-tint:  #241E12;
  --info:  #5D84D6; --info-ink:  #A9C0EA; --info-tint:  #171E2C;
  --flat:  #89867D;

  /* data-viz — lifted for contrast on charcoal */
  --dv-1: #8A7EE0; --dv-2: #6E97E6; --dv-3: #5DBE93;
  --dv-4: #D6AF5E; --dv-5: #B79ACB; --dv-6: #7FA3B4;
  --dv-grid: rgba(255, 255, 255, 0.08); --dv-axis: #6C6A62;

  color-scheme: dark;
}
/* higher-specificity twin so LOB subtrees re-derive their own accent on dark */
[data-theme="dark"] [data-lob] {
  --accent-tint:   color-mix(in srgb, var(--accent) 22%, #201F1C);
  --accent-tint-2: color-mix(in srgb, var(--accent) 12%, #201F1C);
  --accent-border: color-mix(in srgb, var(--accent) 42%, transparent);
  --accent-ink:    color-mix(in srgb, var(--accent) 52%, #F4F2EC);
}

/* KnowsMore — Typography
   Inspire TWDC carries the KnowsMore brand voice; Avenir Next is the body / UI /
   dense-data workhorse (full weights + tabular figures); Newsreader for editorial
   display moments; mono for codes/IDs/timestamps. */

:root {
  /* Families */
  --font-serif: 'Newsreader', 'Iowan Old Style', Georgia, 'Times New Roman', serif;
  --font-sans:  'Avenir Next', 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-brand: 'Inspire TWDC', var(--font-sans);   /* KnowsMore wordmark + own title voice */
  --font-mono:  'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* LOB display nod — used ONLY on title moments (campaign/title name, hero).
     Defaults to the KnowsMore brand voice (Inspire TWDC); each [data-lob] scope
     (colors.css) swaps the family + weight + casing to that brand. UI/body never change. */
  --font-lob-display:      var(--font-brand);
  --lob-display-weight:    400;
  --lob-display-transform: none;
  --lob-display-tracking:  -0.01em;

  /* Weights */
  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;
  --fw-black:    800;

  /* Type scale (px) — UI base is 14, editorial display uses the serif.
     Fixed-px steps below follow an ~1.16–1.3 modular rhythm; use these for
     UI and dense data (predictable, non-reflowing). */
  --fs-display-1: 44px;  --lh-display-1: 1.04;  /* serif hero */
  --fs-display-2: 34px;  --lh-display-2: 1.08;  /* serif title */
  --fs-title-1:   26px;  --lh-title-1:   1.14;  /* serif section title */
  --fs-title-2:   20px;  --lh-title-2:   1.2;   /* serif sub-title */
  --fs-heading:   16px;  --lh-heading:   1.3;   /* sans section header */
  --fs-body-lg:   15px;  --lh-body-lg:   1.55;  /* reading */
  --fs-body:      14px;  --lh-body:      1.5;   /* default UI */
  --fs-body-sm:   13px;  --lh-body-sm:   1.45;
  --fs-caption:   12px;  --lh-caption:   1.4;
  --fs-micro:     11px;  --lh-micro:     1.35;  /* eyebrows, trace stamps */
  --fs-data:      13px;  --lh-data:      1.35;  /* grid cell */
  --fs-data-lg:   15px;  --lh-data-lg:   1.3;   /* KPI value */
  --fs-metric:    30px;  --lh-metric:    1.05;  /* big KPI number */

  /* Fluid display scale — OPT-IN for marketing / hero moments that should
     breathe with the viewport. clamp(min, preferred, max); the fixed steps
     above stay the default for product UI. */
  --fs-fluid-hero:    clamp(34px, 5vw + 1rem, 72px);
  --fs-fluid-display: clamp(28px, 3.4vw + 1rem, 52px);
  --fs-fluid-title:   clamp(22px, 1.6vw + 1rem, 34px);
  --fs-fluid-lead:    clamp(16px, 0.5vw + 1rem, 20px);  /* standfirst / intro */

  /* Tracking */
  --tracking-tight:  -0.014em;   /* serif display */
  --tracking-normal: 0;
  --tracking-eyebrow: 0.09em;    /* uppercase labels */
  --tracking-wide:   0.02em;

  /* Numeric feature sets — apply to any figures in the grid */
  --num-tabular: 'tnum' 1, 'lnum' 1;
  --num-slashed-zero: 'zero' 1;
}

/* KnowsMore — Spacing, Layout & Scaling
   4px base grid. Semantic aliases keep dense screens on rhythm. This layer is
   product-agnostic: breakpoints, z-index, reading measure, grid, and a
   switchable density mode make the system scale to any app, not one. */

:root {
  /* ---- Base 4px spacing ramp ---- */
  --space-0:  0;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-7:  32px;
  --space-8:  40px;
  --space-9:  48px;
  --space-10: 64px;
  --space-11: 80px;
  --space-12: 96px;
  --space-13: 128px;

  /* Spacing usage guide (not enforced, but the intended rhythm):
     1–2  inside a control (icon↔label, chip padding)
     3–4  between related elements (label↔field, list rows)
     5–6  inside a card / between fields
     7–8  between cards / section blocks
     9–11 between major page sections
     12+  hero / page-top breathing room */

  /* ---- Semantic layout ---- */
  --page-pad-x:    clamp(16px, 4vw, 40px);  /* fluid content gutter */
  --page-pad-y:    24px;
  --card-pad:      20px;
  --card-pad-tight:16px;
  --field-pad-x:   12px;
  --field-pad-y:   9px;
  --cell-pad-x:    12px;   /* data grid cell */
  --cell-pad-y:    9px;
  --row-h:         40px;   /* grid / list row height */
  --row-h-compact: 34px;
  --stack-gap:     16px;   /* default vertical rhythm */
  --group-gap:     8px;
  --control-h:     36px;   /* default control height (buttons, fields) */
  --control-h-sm:  30px;
  --control-h-lg:  44px;   /* also the minimum touch target */
  --tap-min:       44px;   /* WCAG target size floor */

  /* ---- Reading measure (prose caps its own width; surfaces stay fluid) ---- */
  --measure:       68ch;   /* body reading blocks */
  --measure-narrow:52ch;
  --measure-wide:  80ch;

  /* ---- Frame ---- */
  --topbar-h:   56px;
  --sidebar-w:  248px;
  --sidebar-w-collapsed: 64px;
  --rail-w:     320px;     /* right context rail */

  /* ---- Containers ----
     PRODUCT SURFACES ARE FULLY FLUID — do NOT cap them (grids add columns,
     reading blocks use --measure). These are OPT-IN caps for bounded layouts
     (marketing, auth, docs), never a global page max. */
  --container-sm:  640px;
  --container-md:  820px;
  --container-lg:  1080px;
  --container-xl:  1320px;
  --content-max:   none;   /* deprecated as a global cap — kept as `none` on purpose */

  /* ---- Responsive breakpoints (min-width) ---- */
  --bp-xs:  480px;
  --bp-sm:  640px;
  --bp-md:  768px;
  --bp-lg:  1024px;
  --bp-xl:  1280px;
  --bp-2xl: 1536px;

  /* ---- Grid ---- */
  --grid-cols:  12;
  --grid-gutter: 16px;
  --grid-gutter-lg: 24px;
  /* Fluid auto-grid: cards gain columns instead of stretching. Usage:
     grid-template-columns: repeat(auto-fill, minmax(var(--col-min), 1fr)); */
  --col-min:      280px;
  --col-min-sm:   200px;
  --col-min-lg:   360px;

  /* ---- Z-index ladder (single source; never hard-code a z-index) ---- */
  --z-base:      0;
  --z-raised:    10;   /* sticky cards, raised rows */
  --z-sticky:    100;  /* sticky headers / topbar */
  --z-nav:       200;  /* app nav / sidebar */
  --z-dropdown:  300;  /* menus, combobox, select popovers */
  --z-overlay:   400;  /* drawer, sheet scrims */
  --z-modal:     500;  /* dialogs */
  --z-popover:   600;  /* popovers, tooltips over modals */
  --z-toast:     700;  /* toasts / notifications */
  --z-max:       9999; /* command palette, dev overlays */
}

/* ============================================================
   DENSITY MODE — switchable, like the dark theme.
   Wrap a subtree in [data-density="compact"] (dense finance/data views)
   or [data-density="spacious"] (marketing / onboarding). Remaps rhythm
   tokens only; components read the semantic tokens so they re-space for free.
   ============================================================ */
[data-density="compact"] {
  --row-h:         34px;
  --cell-pad-y:    6px;
  --field-pad-y:   7px;
  --card-pad:      16px;
  --card-pad-tight:12px;
  --stack-gap:     12px;
  --control-h:     32px;
  --page-pad-y:    18px;
}
[data-density="spacious"] {
  --row-h:         48px;
  --cell-pad-y:    12px;
  --field-pad-y:   12px;
  --card-pad:      28px;
  --card-pad-tight:22px;
  --stack-gap:     22px;
  --control-h:     44px;
  --page-pad-y:    36px;
}

/* KnowsMore — Elevation, Radii, Borders
   Restrained, layered, low-opacity shadows with a warm-neutral cast.
   Editorial surfaces sit close to the page; depth is earned, not decorative. */

:root {
  /* Corner radii — soft, editorial (not pill-heavy) */
  --radius-xs:   4px;
  --radius-sm:   6px;
  --radius-md:   8px;
  --radius-lg:   12px;
  --radius-xl:   16px;
  --radius-card: 10px;
  --radius-pill: 999px;

  /* Shadows — warm ink, tuned for near-white paper */
  --shadow-xs: 0 1px 1px rgba(28,27,24,0.05);
  --shadow-sm: 0 1px 2px rgba(28,27,24,0.06), 0 1px 1px rgba(28,27,24,0.04);
  --shadow-md: 0 2px 4px rgba(28,27,24,0.06), 0 6px 16px rgba(28,27,24,0.07);
  --shadow-lg: 0 8px 24px rgba(28,27,24,0.10), 0 2px 6px rgba(28,27,24,0.06);
  --shadow-pop: 0 16px 48px rgba(24,22,20,0.18), 0 4px 12px rgba(24,22,20,0.10);

  /* Inner / inset (data wells, pressed) */
  --shadow-inset: inset 0 1px 2px rgba(28,27,24,0.06);

  /* Hairlines */
  --hairline:        1px solid var(--border-subtle);
  --hairline-strong: 1px solid var(--border-default);

  /* Focus */
  --ring: var(--focus-ring);
}

/* KnowsMore — Motion (mirrors the Vibe motion system at FULL liveliness).

   Tactile and physical: soft lifts with a small randomized tilt, springy
   pops, pressed compression, sliding indicators, staggered reveals.
   Marketing-ops energy — lively, not stiff. All durations flow through
   tokens so prefers-reduced-motion collapses the whole system at once.
   JS toolkit: components/motion/Motion.jsx. */

:root {
  /* Durations: fast = hover/press, standard = state changes, emphasized = modals/shuffles */
  --motion-fast:       140ms;
  --motion-standard:   240ms;
  --motion-emphasized: 420ms;
  --motion-celebrate:  560ms;

  /* Easings */
  --ease-out-soft: cubic-bezier(0.4, 0, 0.2, 1);      /* confident glide */
  --ease-settle:   cubic-bezier(0.22, 1, 0.36, 1);    /* decisive ease-out */
  --ease-spring:   cubic-bezier(0.34, 1.56, 0.64, 1); /* elastic pop (Vibe) */
  --ease-press:    cubic-bezier(0.4, 0, 1, 1);        /* quick compression */

  /* Tactile scale amounts (Vibe) */
  --press-scale: 0.97;
  --hover-scale: 1.02;
  --pop-scale:   1.06;
  --lift-hover:  translateY(-2px);

  /* ---- Back-compat aliases: existing KnowsMore token names keep working ---- */
  --dur-press:      var(--motion-fast);
  --dur-hover:      var(--motion-fast);
  --dur-enter:      var(--motion-standard);
  --dur-panel:      var(--motion-emphasized);
  --dur-celebrate:  var(--motion-celebrate);
  --ease-standard:  var(--ease-out-soft);
  --ease-out:       var(--ease-settle);
  --ease-in:        var(--ease-press);
  --transition-base: var(--motion-fast) var(--ease-out-soft);
}

/* ── Reveal keyframes ─────────────────────────────────────── */
@keyframes km-pop-in {
  from { opacity: 0; transform: scale(0.94); }
  to   { opacity: 1; transform: scale(1); }
}
@keyframes km-rise-in {
  from { opacity: 0; transform: translateY(7px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes km-menu-in {
  from { opacity: 0; transform: translateY(-5px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes km-modal-in {
  from { opacity: 0; transform: translateY(10px) scale(0.965); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes km-backdrop-in {
  from { opacity: 0; } to { opacity: 1; }
}
@keyframes km-toast-in {
  from { opacity: 0; transform: translateY(14px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes km-check-pop {
  0%   { transform: scale(0.7); }
  55%  { transform: scale(1.12); }
  100% { transform: scale(1); }
}
@keyframes km-pop-bounce {
  0%   { transform: scale(0.8); opacity: 0; }
  60%  { transform: scale(1.06); opacity: 1; }
  100% { transform: scale(1); }
}
@keyframes km-shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  50% { transform: translateX(3px); }
  75% { transform: translateX(-2px); }
}
@keyframes km-grow-x {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}

/* ── Utility classes for consumers ────────────────────────── */
.km-rise-in  { animation: km-rise-in var(--motion-standard) var(--ease-settle) backwards; }
.km-pop-in   { animation: km-pop-in var(--motion-standard) var(--ease-spring) both; }
.km-menu-in  { animation: km-menu-in var(--motion-fast) var(--ease-settle) both; }
.km-modal-in { animation: km-modal-in var(--motion-emphasized) var(--ease-spring) both; }
.km-toast-in { animation: km-toast-in var(--motion-emphasized) var(--ease-spring) both; }
.km-shake    { animation: km-shake 340ms var(--ease-out-soft) both; }

/* Springy pressable — hover lift + press compression via one class */
.km-pressable {
  transition: transform var(--motion-standard) var(--ease-spring), box-shadow var(--motion-standard) var(--ease-out-soft);
}
.km-pressable:hover  { transform: scale(var(--hover-scale)); }
.km-pressable:active { transform: scale(var(--press-scale)); transition-duration: var(--motion-fast); transition-timing-function: var(--ease-press); }

/* Lift variant (cards): rise + shadow on hover */
.km-lift {
  transition: transform var(--motion-standard) var(--ease-spring), box-shadow var(--motion-standard) var(--ease-out-soft);
}
.km-lift:hover  { transform: var(--lift-hover); box-shadow: var(--shadow-md); }
.km-lift:active { transform: scale(var(--press-scale)); transition-duration: var(--motion-fast); }

/* Staggered reveal (index-based delay, 40ms step like Vibe) */
.km-stagger > * { animation: km-rise-in var(--motion-standard) var(--ease-settle) backwards; }
.km-stagger > *:nth-child(1)  { animation-delay: 0ms; }
.km-stagger > *:nth-child(2)  { animation-delay: 40ms; }
.km-stagger > *:nth-child(3)  { animation-delay: 80ms; }
.km-stagger > *:nth-child(4)  { animation-delay: 120ms; }
.km-stagger > *:nth-child(5)  { animation-delay: 160ms; }
.km-stagger > *:nth-child(6)  { animation-delay: 200ms; }
.km-stagger > *:nth-child(7)  { animation-delay: 240ms; }
.km-stagger > *:nth-child(8)  { animation-delay: 280ms; }
.km-stagger > *:nth-child(9)  { animation-delay: 320ms; }
.km-stagger > *:nth-child(10) { animation-delay: 360ms; }
.km-stagger > *:nth-child(11) { animation-delay: 400ms; }
.km-stagger > *:nth-child(12) { animation-delay: 440ms; }

/* ── Reduced motion: collapse the whole system ────────────── */
@media (prefers-reduced-motion: reduce) {
  :root {
    --motion-fast: 1ms; --motion-standard: 1ms; --motion-emphasized: 1ms; --motion-celebrate: 1ms;
    --press-scale: 1; --hover-scale: 1; --pop-scale: 1; --lift-hover: none;
  }
}

/* KnowsMore — shared keyframes (referenced by components: Button spinner,
   Dialog/Tooltip enters, quiet celebration). Kept minimal and quiet. */

@keyframes km-spin { to { transform: rotate(360deg); } }

@keyframes km-fade {
  from { opacity: 0; }
  to   { opacity: 1; }
}

@keyframes km-pop {
  from { opacity: 0; transform: translateY(6px) scale(0.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Quiet celebration — a single soft rise used on close/approve. */
@keyframes km-celebrate {
  0%   { opacity: 0; transform: translateY(10px); }
  55%  { opacity: 1; transform: translateY(-2px); }
  100% { opacity: 1; transform: translateY(0); }
}

/* ── Commit-confirmation set (promoted from the Micro-interactions studies).
   The restrained gesture vocabulary used by AsyncButton, CurrencyStepper,
   Slider, TokenInput, InlineEdit, SearchField, Drawer, Skeleton, etc. Every
   one is guarded by prefers-reduced-motion in its component too. ── */
@keyframes km-field-pulse {
  0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }
  30%  { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); }
}
@keyframes km-cell-flash { 0% { background: var(--accent-tint); } 100% { background: transparent; } }
@keyframes km-value-pop { 0% { transform: scale(1); } 28% { transform: scale(0.9); } 60% { transform: scale(1.09); } 100% { transform: scale(1); } }
@keyframes km-digit-up   { from { opacity: 0; transform: translateY(9px); }  to { opacity: 1; transform: translateY(0); } }
@keyframes km-digit-down { from { opacity: 0; transform: translateY(-9px); } to { opacity: 1; transform: translateY(0); } }
@keyframes km-box-pop    { 0% { transform: scale(0.55); } 52% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes km-chip-in    { 0% { opacity: 0; transform: scale(0.7); } 60% { opacity: 1; transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes km-chip-out   { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.5); } }
@keyframes km-ring-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 40%, transparent); } 100% { box-shadow: 0 0 0 7px color-mix(in srgb, var(--accent) 0%, transparent); } }
@keyframes km-save-flash { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--fav) 42%, transparent); } 30% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--fav) 16%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes km-drawer-in  { 0% { transform: translateX(100%); } 72% { transform: translateX(-1.8%); } 100% { transform: translateX(0); } }
@keyframes km-shimmer    { to { background-position: -400% 0; } }

/* ── Date-picker commit gesture (promoted from the Micro-interactions studies):
   the chosen day flies on an arc into the field, bumping the month left and the
   year right before the day drops into place. ── */
@keyframes km-cal-row    { from { opacity: 0; transform: translateY(8px) scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes km-day-drop   { 0% { transform: translateY(-13px) scale(1.18); opacity: 0; } 55% { opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
@keyframes km-bump-left  { 0% { transform: translateX(0); } 40% { transform: translateX(-4px); } 100% { transform: translateX(0); } }
@keyframes km-bump-right { 0% { transform: translateX(0); } 40% { transform: translateX(5px); } 100% { transform: translateX(0); } }

/* Indeterminate progress sweep (Progress variant="indeterminate"). */
@keyframes km-indet { 0% { left: -40%; width: 40%; } 50% { width: 55%; } 100% { left: 100%; width: 30%; } }



/* Workbench Dashboard — KnowsMore operating-site adapter (v6)
   Contract: DESIGN.md in this directory. Class names and custom-property
   NAMES are a stable API for app.js — re-valued here, never removed.
   Sections:
     1. Tokens (light)          2. Tokens (dark — single override block)
     3. Reset & base            4. Typography
     5. Shell: sidebar/nav/main 6. Page scaffolding & callout
     7. Buttons & inputs        8. Chips, tags, dots, donuts
     9. Cards, grids, tiles    10. Rows, lists, tables
    11. Status rail & ops      12. Usage & charts
    13. Modals, toast, misc    14. Motion & states
    15. Markdown               16. Responsive + reduced motion
*/

/* ============ 1. Tokens (light) ============ */
:root {
  color-scheme: light;

  /* Type */
  --font-body: Avenir Next, Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-display: Avenir Next, Avenir, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
    monospace;

  /* Surfaces & ink */
  --canvas: #fbfaf8;
  --base: #fbfaf8;
  --raised: #ffffff;
  --subtle: rgba(55, 53, 47, 0.06);
  --muted-surface: rgba(55, 53, 47, 0.04);
  --text: #1c1b18;
  --text-2: rgba(28, 27, 24, 0.66);
  --text-3: rgba(28, 27, 24, 0.46);
  --inverted: #ffffff;
  --border: rgba(28, 27, 24, 0.16);
  --border-subtle: rgba(28, 27, 24, 0.09);
  --border-strong: rgba(28, 27, 24, 0.26);

  /* Accent — the one color */
  --accent-hero: #3d4a41;
  --accent-hero-contrast: #ffffff;
  --focus: var(--accent-hero);
  --brand: var(--accent-hero);
  --brand-hover: color-mix(in srgb, var(--accent-hero) 86%, black);
  --brand-soft: color-mix(in srgb, var(--accent-hero) 12%, transparent);
  --brand-deep: color-mix(in srgb, var(--accent-hero) 75%, black);

  /* Signals */
  --danger: #eb5757;
  --danger-hover: #d64545;
  --danger-soft: rgba(235, 87, 87, 0.12);
  --positive: #448361;
  --positive-deep: #337356;
  --positive-soft: rgba(68, 131, 97, 0.12);
  --warning: #d9730d;
  --warning-soft: rgba(217, 115, 13, 0.12);

  /* Muted tag palette (Notion database-tag style) */
  --tag-gray-bg: rgba(55, 53, 47, 0.08);
  --tag-gray-text: #6b6a66;
  --tag-blue-bg: rgba(51, 126, 169, 0.14);
  --tag-blue-text: #2b6a8f;
  --tag-green-bg: rgba(68, 131, 97, 0.14);
  --tag-green-text: #337356;
  --tag-orange-bg: rgba(217, 115, 13, 0.14);
  --tag-orange-text: #a75a08;
  --tag-purple-bg: rgba(144, 101, 176, 0.14);
  --tag-purple-text: #7a539b;

  /* Legacy hue names re-valued to the muted palette */
  --purple: #9065b0;
  --pink: #b0567f;
  --blue: #337ea9;
  --yellow: #cb912f;

  /* Legacy status tokens re-valued */
  --status-success-soft: rgba(68, 131, 97, 0.12);
  --status-success-solid: #448361;
  --status-success-text: #337356;
  --status-warning-soft: rgba(217, 115, 13, 0.12);
  --status-warning-solid: #d9730d;
  --status-warning-text: #a75a08;
  --status-error-soft: rgba(235, 87, 87, 0.12);
  --status-error-solid: #eb5757;
  --status-error-text: #c04141;
  --status-info-soft: rgba(51, 126, 169, 0.12);
  --status-info-solid: #337ea9;
  --status-info-text: #2b6a8f;

  /* AI-lane identity (muted; used by creditbars/donuts/brand icons) */
  --anthropic-slate: #262625;
  --anthropic-cloud: #91918d;
  --anthropic-ivory: #fafaf7;
  --anthropic-focus: #c96f3f;
  --anthropic-error: #bf4d43;
  --cursor-black: #37352f;
  --gpt-blue: #337ea9;
  --openai-green: #448361;
  --vscode-blue: #337ea9;

  /* Elevation: borders do the work, not shadows */
  --shadow-xs: 0 0 0 1px var(--border-subtle);
  --shadow-sm: 0 1px 2px rgba(15, 15, 15, 0.06);
  --shadow-md: 0 0 0 1px rgba(15, 15, 15, 0.05),
    0 3px 6px rgba(15, 15, 15, 0.1), 0 9px 24px rgba(15, 15, 15, 0.2);
  --shadow-lg: 0 0 0 1px rgba(15, 15, 15, 0.05),
    0 3px 6px rgba(15, 15, 15, 0.1), 0 9px 24px rgba(15, 15, 15, 0.2);

  /* Radius */
  --r-xs: 3px;
  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 10px;
  --r-xl: 14px;
  --r-xxl: 16px;
  --pill: 9999px;

  /* Motion — quiet, no springs */
  --fast: 140ms;
  --standard: 240ms;
  --slow: 420ms;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --motion-fast: 140ms;
  --motion-standard: 240ms;
  --motion-emphasized: 420ms;
  --ease-out-soft: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-settle: cubic-bezier(0.2, 0, 0, 1);
  --ease-spring: cubic-bezier(0.22, 1.56, 0.36, 1);
  --ease-press: cubic-bezier(0.2, 0, 0, 1);

  /* Layout */
  --side: 248px;
  --bottom-nav: 62px;
}

/* ============ 2. Tokens (dark) — the ONE dark override block ============ */
[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #202020;
  --base: #191919;
  --raised: #252525;
  --subtle: rgba(255, 255, 255, 0.055);
  --muted-surface: rgba(255, 255, 255, 0.03);
  --text: rgba(255, 255, 255, 0.81);
  --text-2: rgba(255, 255, 255, 0.46);
  --text-3: rgba(255, 255, 255, 0.28);
  --inverted: #191919;
  --border: rgba(255, 255, 255, 0.13);
  --border-subtle: rgba(255, 255, 255, 0.075);
  --border-strong: rgba(255, 255, 255, 0.24);
  --focus: #529cca;
  --brand: #529cca;
  --brand-hover: #5fa8d6;
  --brand-soft: rgba(82, 156, 202, 0.16);
  --brand-deep: #9ec9e8;
  --danger: #eb5757;
  --danger-hover: #f06e6e;
  --danger-soft: rgba(235, 87, 87, 0.18);
  --positive: #4f9768;
  --positive-deep: #6fb18a;
  --positive-soft: rgba(79, 151, 104, 0.18);
  --warning: #d9730d;
  --warning-soft: rgba(217, 115, 13, 0.18);
  --tag-gray-bg: rgba(255, 255, 255, 0.08);
  --tag-gray-text: rgba(255, 255, 255, 0.6);
  --tag-blue-bg: rgba(82, 156, 202, 0.18);
  --tag-blue-text: #86b9d9;
  --tag-green-bg: rgba(79, 151, 104, 0.18);
  --tag-green-text: #83b697;
  --tag-orange-bg: rgba(217, 115, 13, 0.2);
  --tag-orange-text: #d9935a;
  --tag-purple-bg: rgba(144, 101, 176, 0.22);
  --tag-purple-text: #b295c9;
  --purple: #b295c9;
  --pink: #c98aa6;
  --blue: #529cca;
  --yellow: #c9924b;
  --status-success-soft: rgba(79, 151, 104, 0.18);
  --status-success-solid: #4f9768;
  --status-success-text: #83b697;
  --status-warning-soft: rgba(217, 115, 13, 0.2);
  --status-warning-solid: #d9730d;
  --status-warning-text: #d9935a;
  --status-error-soft: rgba(235, 87, 87, 0.18);
  --status-error-solid: #eb5757;
  --status-error-text: #e08a8a;
  --status-info-soft: rgba(82, 156, 202, 0.18);
  --status-info-solid: #529cca;
  --status-info-text: #86b9d9;
  --anthropic-focus: #d08a5e;
  --anthropic-ivory: #2e2c28;
  --cursor-black: rgba(255, 255, 255, 0.81);
  --gpt-blue: #529cca;
  --openai-green: #4f9768;
  --vscode-blue: #529cca;
  --shadow-xs: 0 0 0 1px var(--border-subtle);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 0 0 1px rgba(255, 255, 255, 0.06),
    0 3px 6px rgba(0, 0, 0, 0.3), 0 9px 24px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 0 0 1px rgba(255, 255, 255, 0.06),
    0 3px 6px rgba(0, 0, 0, 0.3), 0 9px 24px rgba(0, 0, 0, 0.5);
}

/* ============ 3. Reset & base ============ */
* {
  box-sizing: border-box;
}
/* Scrolling stays fully functional everywhere — only the scrollbar chrome is
   hidden. Iframes (docs viewer) render their own document and are exempt. */
html,
body,
* {
  scrollbar-width: none;
}
html::-webkit-scrollbar,
body::-webkit-scrollbar,
*::-webkit-scrollbar {
  display: none;
}
html,
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font-body);
  background: var(--canvas);
  color: var(--text);
  font-size: 14.5px;
  font-variant-numeric: tabular-nums;
  line-height: 1.55;
}
body {
  overflow-x: hidden;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.5;
}
a {
  color: var(--brand);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
code {
  font-family: var(--font-mono);
  font-size: 0.92em;
  background: var(--muted-surface);
  border-radius: var(--r-sm);
  padding: 1px 5px;
}
.hidden {
  display: none !important;
}

/* Cold boot overlay — visible before JS bundles parse */
.wb-boot-overlay {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
  background: var(--canvas);
  transition: opacity 280ms var(--ease), visibility 280ms var(--ease);
}
.wb-boot-overlay.wb-boot-overlay--done {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
html:not(.wb-booting) .wb-boot-overlay {
  display: none;
}
html.wb-booting #landing,
html.wb-autoconnect #landing {
  display: none !important;
}
html.wb-booting #app {
  pointer-events: none;
}
html.wb-booting #app .shell,
html.wb-booting #app .mobile-top,
html.wb-booting #app .mobile-tabs,
html.wb-booting #view {
  visibility: hidden;
}
.auth-screen {
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 32px 20px;
  background: var(--canvas);
}
.auth-panel {
  width: min(100%, 420px);
  padding: 40px 0;
}
.auth-brand { margin-bottom: 56px; }
.auth-panel h1 {
  margin: 0 0 12px;
  font-size: 1.75rem;
  line-height: 1.2;
  letter-spacing: -0.025em;
  text-wrap: balance;
}
.auth-panel .lede {
  max-width: 36ch;
  margin-bottom: 28px;
  color: var(--text-2);
}
.auth-submit { min-height: 44px; }
.auth-footnote {
  max-width: 40ch;
  margin-top: 20px;
  color: var(--text-2);
  font-size: 0.8125rem;
  line-height: 1.55;
}
.wb-boot-card {
  width: min(360px, 100%);
  padding: 28px 24px 22px;
  border-radius: var(--r-lg);
  border: 1px solid var(--border-subtle);
  background: var(--surface, var(--canvas));
  box-shadow: var(--shadow-md);
  text-align: center;
  display: grid;
  gap: 12px;
  justify-items: center;
}
.wb-boot-spinner {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid var(--border-strong);
  border-top-color: var(--brand);
  animation: spin 0.85s linear infinite;
}
.wb-boot-wordmark {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
}
.wb-boot-status {
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-2);
  min-height: 1.45em;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* ============ 4. Typography ============ */
h1,
h2,
h3 {
  font-family: var(--font-display);
  margin: 0;
  color: var(--text);
}
h1 {
  font-size: 28px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: -0.01em;
}
h2 {
  font-size: 18px;
  line-height: 1.3;
  font-weight: 600;
}
h3 {
  font-size: 14.5px;
  line-height: 1.4;
  font-weight: 600;
}
.lede {
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text-2);
  margin: 6px 0 0;
}
.muted {
  color: var(--text-2);
}
.tiny {
  font-size: 12.5px;
  color: var(--text-3);
}
.kicker {
  font-size: 11.5px;
  line-height: 1.4;
  font-weight: 500;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.section-note {
  margin: 2px 0 0;
  color: var(--text-2);
  font-size: 12.5px;
}
.num {
  font-variant-numeric: tabular-nums;
}
.reco-title {
  font-size: 16px;
  line-height: 1.4;
  font-weight: 600;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.clamp-2,
.clamp-3 {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.clamp-2 {
  -webkit-line-clamp: 2;
}
.clamp-3 {
  -webkit-line-clamp: 3;
}

/* ============ 5. Shell: sidebar, nav, main ============ */
.shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: var(--side) 1fr;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 14px 10px;
  background: var(--canvas);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
}
.mark {
  background: #37352f;
  border-radius: var(--r-md);
  flex: none;
}
[data-theme="dark"] .mark {
  background: rgba(255, 255, 255, 0.14);
}
.mark-sm {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
}
.wordmark {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
}
#mobileSummary {
  flex: 1;
  min-width: 0;
}
.ver {
  font-size: 12px;
  color: var(--text-3);
  margin-left: auto;
}
.nav {
  display: grid;
  gap: 1px;
  position: relative;
}
.nav button,
.moreitem {
  border: 0;
  background: transparent;
  color: var(--text-2);
  border-radius: var(--r-md);
  min-height: 28px;
  padding: 4px 8px;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.nav button svg {
  flex: none;
  color: var(--text-3);
  transition: color var(--fast) var(--ease);
}
.nav button:hover,
.moreitem:hover {
  background: var(--subtle);
  color: var(--text);
}
/* Active nav = quiet ink on a soft fill, not blue (Notion) */
.nav button.active {
  background: var(--subtle);
  color: var(--text);
  font-weight: 600;
}
.nav button.active svg,
.nav button:hover svg {
  color: var(--text-2);
}
/* setupNavIndicator() still injects and positions this element; the active
   state is pure CSS now, so the indicator is styled inert and invisible. */
.nav-indicator {
  display: none;
}
.side-actions {
  margin-top: auto;
  display: grid;
  gap: 1px;
}
/* Quiet text rows; only Quick capture keeps a bordered button look */
.side-actions .btn {
  border-color: transparent;
  background: transparent;
  color: var(--text-2);
  font-weight: 500;
  min-height: 28px;
  padding: 4px 8px;
  justify-content: flex-start;
  text-align: left;
  box-shadow: none;
}
.side-actions .btn:hover {
  background: var(--subtle);
  color: var(--text);
}
.side-actions .btn.primary {
  background: var(--base);
  border: 1px solid var(--border);
  color: var(--text);
  font-weight: 500;
  margin-bottom: 8px;
  justify-content: center;
}
.side-actions .btn.primary:hover {
  background: var(--subtle);
}
/* Content plane: white sheet against the canvas frame */
.main {
  min-width: 0;
  background: var(--base);
  padding: 40px 32px 64px;
}
.main > * {
  max-width: 1100px;
  margin-inline: auto;
}
.status-rail,
#view {
  width: 100%;
}
.mobile-top,
.mobile-tabs {
  display: none;
}

/* ============ 6. Page scaffolding & callout ============ */
.page {
  display: grid;
  gap: 24px;
}
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  align-items: end;
  padding-bottom: 4px;
}
/* Notion callout block — the Overview "What's next" signature element */
.callout {
  background: var(--muted-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  box-shadow: none;
}
.callout .cardhead {
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 0;
}
.callout-glyph {
  flex: none;
  font-size: 20px;
  line-height: 1.3;
}
.callout .cardhead > div:not(.action-tools) {
  flex: 1;
  min-width: 0;
}
.empty-state {
  border: 1px dashed var(--border);
  background: transparent;
  border-radius: var(--r-lg);
  padding: 18px;
  text-align: center;
  color: var(--text-2);
}

/* ============ 7. Buttons & inputs ============ */
.btn,
.iconbtn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  border-radius: var(--r-md);
  min-height: 28px;
  padding: 3px 10px;
  font-size: 14px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background var(--fast) var(--ease),
    border-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.btn:hover,
.iconbtn:hover {
  background: var(--subtle);
}
.btn:active,
.iconbtn:active {
  background: var(--muted-surface);
}
.btn.primary {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}
.btn.primary:hover {
  background: var(--brand-hover);
  border-color: var(--brand-hover);
}
.btn.danger {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
}
.btn.danger:hover {
  background: var(--danger-hover);
}
.btn.tertiary {
  border-color: transparent;
  background: transparent;
  color: var(--text-2);
}
.btn.tertiary:hover {
  background: var(--subtle);
  color: var(--text);
}
.iconbtn {
  width: 28px;
  padding: 0;
  border-color: transparent;
  color: var(--text-2);
}
.iconbtn:hover {
  color: var(--text);
}
.wiz-big {
  min-height: 44px;
}
.input,
select,
textarea {
  border: 1px solid var(--border);
  background: var(--base);
  color: var(--text);
  border-radius: var(--r-md);
  padding: 5px 10px;
  min-height: 30px;
  width: 100%;
  font-size: 14.5px;
  transition: border-color var(--fast) var(--ease),
    box-shadow var(--fast) var(--ease);
}
.input::placeholder,
textarea::placeholder {
  color: var(--text-3);
}
.input:hover,
select:hover,
textarea:hover {
  border-color: var(--border-strong);
}
.input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--brand);
  box-shadow: 0 0 0 2px var(--brand-soft);
}
.toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.tag-cloud {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  min-width: 0;
}
.form-row {
  display: grid;
  gap: 6px;
}
.form-two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.capture-grid {
  display: grid;
  gap: 12px;
}
.task-filter-inline {
  display: contents;
}
.filter-sheet-btn {
  display: none;
}

/* Segmented filters: quiet text chips, active = soft ink fill */
.tabs,
.seg {
  display: flex;
  gap: 2px;
  flex-wrap: wrap;
}
.tab,
.seg button {
  border: 0;
  background: transparent;
  border-radius: var(--r-md);
  padding: 3px 10px;
  min-height: 28px;
  color: var(--text-2);
  font-size: 13.5px;
  font-weight: 500;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
}
.tab:hover,
.seg button:hover {
  background: var(--subtle);
  color: var(--text);
}
.tab.active,
.seg button.active {
  background: var(--subtle);
  color: var(--text);
  font-weight: 600;
}

/* ============ 8. Chips, tags, dots, donuts ============ */
.chip,
.tag,
.healthchip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: var(--tag-gray-bg);
  color: var(--tag-gray-text);
  border-radius: var(--r-sm);
  padding: 2px 8px;
  font-size: 12px;
  line-height: 1.5;
  font-weight: 500;
  min-height: 22px;
  transition: background var(--fast) var(--ease), color var(--fast) var(--ease);
}
button.chip:hover,
button.tag:hover {
  background: var(--subtle);
  color: var(--text);
}
.chip.active,
.tag.active {
  background: var(--brand-soft);
  color: var(--brand-deep);
  font-weight: 600;
}
.chip.ok {
  background: var(--tag-green-bg);
  color: var(--tag-green-text);
}
.chip.warn {
  background: var(--tag-orange-bg);
  color: var(--tag-orange-text);
}
.chip.bad {
  background: var(--status-error-soft);
  color: var(--status-error-text);
}
.healthchip.ok {
  background: var(--tag-green-bg);
  color: var(--tag-green-text);
}
.healthchip.warn {
  background: var(--tag-orange-bg);
  color: var(--tag-orange-text);
}
.healthchip.bad {
  background: var(--status-error-soft);
  color: var(--status-error-text);
}
.health {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.chip.refreshing {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip.refreshing .spin {
  width: 10px;
  height: 10px;
  border: 1.5px solid var(--border);
  border-top-color: var(--text-2);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
/* Status dots: quiet 6px marks, no glow rings */
.status-dot-ui,
.machine-dot,
.sync-dot,
.live-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  vertical-align: middle;
  background: var(--status-info-solid);
}
.status-dot-ui {
  margin-right: 6px;
}
.status-dot-ui.live,
.status-dot-ui.ok,
.status-dot-ui.active,
.machine-dot.active,
.sync-dot.ok,
.live-dot {
  background: var(--positive);
}
.status-dot-ui.warn,
.status-dot-ui.idle,
.machine-dot.idle,
.sync-dot.warn {
  background: var(--warning);
}
.status-dot-ui.bad,
.status-dot-ui.down,
.machine-dot.down,
.sync-dot.bad {
  background: var(--danger);
}
.status-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  display: inline-block;
}
.status-dot.doing {
  border-color: var(--brand);
  background: linear-gradient(90deg, var(--brand) 50%, transparent 50%);
}
.status-dot.done {
  background: var(--positive);
  border-color: var(--positive);
}
.status-dot.blocked {
  background: var(--warning);
  border-color: var(--warning);
}
.status-dot.idea {
  border-style: dashed;
}
/* Quiet presence marker for a project's intent.md -- not a status, so it
   stays on the muted text color rather than any status hue. */
.intent-marker {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  vertical-align: middle;
  background: var(--text-secondary);
  opacity: 0.6;
}
/* Pure-CSS donut: track --subtle, fill --brand via --p */
.donut {
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
  border-radius: 50%;
  display: inline-block;
  background: conic-gradient(
    var(--donut-c, var(--brand)) calc(var(--p, 0) * 1%),
    var(--subtle) 0
  );
  -webkit-mask: radial-gradient(circle, transparent 4.5px, #000 5px);
  mask: radial-gradient(circle, transparent 4.5px, #000 5px);
}
.donut.anthropic {
  --donut-c: var(--anthropic-focus);
}
.donut.cursor {
  --donut-c: var(--cursor-black);
}
.donut.openai {
  --donut-c: var(--gpt-blue);
}
.donut.codex {
  --donut-c: var(--openai-green);
}
.donut.local {
  --donut-c: var(--positive);
}
.donut.no-data {
  background: var(--subtle);
  opacity: 0.55;
  outline: 1px dashed var(--text-3);
  outline-offset: -1px;
}

/* ============ 9. Cards, grids, tiles ============ */
.grid {
  display: grid;
  gap: 14px;
}
.cols-2 {
  grid-template-columns: 1.2fr 0.8fr;
}
.cols-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.rail-card,
.card,
.panel,
.modal-card,
.sheet-card {
  background: var(--raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  box-shadow: none;
}
.card {
  padding: 16px;
  transition: background var(--standard) var(--ease),
    border-color var(--standard) var(--ease);
}
.card.compact {
  padding: 14px;
}
.cardhead {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: start;
  margin-bottom: 10px;
}
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}
.metric-card {
  border: 1px solid var(--border-subtle);
  background: var(--raised);
  border-radius: var(--r-lg);
  padding: 12px 14px;
  min-height: 84px;
  text-align: left;
  color: var(--text);
  transition: background var(--fast) var(--ease),
    border-color var(--fast) var(--ease);
}
button.metric-card:hover {
  background: var(--subtle);
  border-color: var(--border);
}
.metric-card .num {
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.metric-card .label {
  font-size: 11.5px;
  color: var(--text-3);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.metric-card .hint {
  font-size: 12.5px;
  color: var(--text-2);
  margin-top: 2px;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 14px;
}
.project-tile {
  border: 1px solid var(--border-subtle);
  background: var(--raised);
  border-radius: var(--r-lg);
  overflow: hidden;
  text-align: left;
  color: var(--text);
  box-shadow: none;
  transition: background var(--fast) var(--ease),
    border-color var(--fast) var(--ease);
}
.project-tile:hover {
  border-color: var(--border-strong);
  background: var(--muted-surface);
}
.cover {
  height: 130px;
  background: var(--muted-surface);
  display: grid;
  place-items: center;
  overflow: hidden;
  border-bottom: 1px solid var(--border-subtle);
}
.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.cover > span {
  font-size: 24px;
  font-weight: 600;
  color: var(--text-3);
}
.tilebody {
  padding: 12px 14px;
}
.row-title {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
}
.progress {
  height: 4px;
  border-radius: var(--pill);
  background: var(--subtle);
  overflow: hidden;
  display: block;
}
.progress i {
  display: block;
  height: 100%;
  background: var(--brand);
  border-radius: inherit;
  transition: width var(--standard) var(--ease);
}
.project-header {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
}
.project-cover {
  width: 150px;
  height: 100px;
  border-radius: var(--r-md);
  background: var(--muted-surface);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
}
.project-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.task-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 18px;
}
#taskList {
  display: grid;
  gap: 14px;
}
.docs,
.shots {
  display: flex;
  gap: 10px;
  overflow: auto;
  padding-bottom: 4px;
}
.shot {
  width: 124px;
  height: 82px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-subtle);
  object-fit: cover;
  background: var(--muted-surface);
  flex: 0 0 auto;
}
.intake-banner {
  border-color: rgba(217, 115, 13, 0.35);
  background: var(--warning-soft);
}

/* ============ 10. Rows, lists, tables ============ */
.queue {
  display: grid;
  gap: 0;
}
/* Notion database rows: hairline dividers, hover tint, no boxes */
.qrow,
.table-row,
.task-row,
.kb-row {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
  border-radius: 0;
  padding: 10px 8px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  text-align: left;
  color: var(--text);
  transition: background var(--fast) var(--ease);
}
.qrow:hover,
.table-row:hover,
.task-row:hover,
.kb-row:hover {
  background: var(--subtle);
}
.qrow:first-child,
.table-row:first-child,
.task-row:first-child,
.kb-row:first-child {
  border-top: 1px solid var(--border-subtle);
}
.task-row {
  grid-template-columns: 34px minmax(0, 1fr) auto;
}
.table {
  display: grid;
  gap: 0;
}
.table-head,
.table-row {
  grid-template-columns: 44px minmax(180px, 1.4fr) 0.7fr 0.7fr 0.5fr 0.5fr 0.5fr 0.8fr;
}
.table-head {
  display: grid;
  gap: 12px;
  padding: 6px 8px;
  color: var(--text-3);
  font-size: 12.5px;
  font-weight: 500;
  border-bottom: 1px solid var(--border-subtle);
}
.refined-list {
  display: grid;
  gap: 0;
}
.refined-row {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
  border-radius: 0;
  padding: 10px 8px;
  color: var(--text);
  text-align: left;
  transition: background var(--fast) var(--ease);
}
.refined-row:last-child {
  border-bottom: 0;
}
.refined-row:hover {
  background: var(--subtle);
}
.refined-row > span:first-child {
  min-width: 0;
  display: block;
}
.refined-title {
  display: block;
  font-weight: 600;
  white-space: normal;
  overflow-wrap: anywhere;
}
.refined-sub {
  display: block;
  font-size: 12.5px;
  color: var(--text-2);
  margin-top: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.refined-meta {
  display: flex;
  gap: 6px;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
}
.action-tools {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.qrow .action-tools,
.task-row .action-tools,
.kb-row .action-tools,
.refined-row .action-tools {
  opacity: 0.75;
  transition: opacity var(--fast) var(--ease);
}
.qrow:hover .action-tools,
.task-row:hover .action-tools,
.kb-row:hover .action-tools,
.refined-row:hover .action-tools,
.qrow:focus-visible .action-tools,
.task-row:focus-visible .action-tools,
.kb-row:focus-visible .action-tools {
  opacity: 1;
}
.lane-clear {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border: 1px dashed var(--border-subtle);
  border-radius: var(--r-md);
  color: var(--text-3);
  font-size: 12.5px;
}
.lane-clear-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--positive);
  flex: none;
}
.lane-empty {
  border-style: dashed;
  box-shadow: none;
}
.lane-empty .cardhead {
  margin-bottom: 0;
}
.palette-list {
  display: grid;
  gap: 1px;
}
.cmd-row {
  border: 0;
  background: transparent;
  border-radius: var(--r-md);
  padding: 8px 10px;
  text-align: left;
  color: var(--text);
  display: flex;
  justify-content: space-between;
  transition: background var(--fast) var(--ease);
}
.cmd-row:hover,
.cmd-row.active {
  background: var(--subtle);
}
.sheet-list {
  background: var(--raised);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  overflow: hidden;
}
.sheet-list .sheet-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  min-height: 44px;
  padding: 10px 14px;
  border: 0;
  background: transparent;
  color: var(--text);
  font-size: 14.5px;
  font-weight: 500;
  text-align: left;
  transition: background var(--fast) var(--ease);
}
.sheet-list .sheet-row + .sheet-row {
  border-top: 1px solid var(--border-subtle);
}
.sheet-list .sheet-row:hover,
.sheet-list .sheet-row:active {
  background: var(--subtle);
}
.sheet-chev {
  color: var(--text-3);
  font-size: 16px;
}
.ver-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 9px 8px;
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
}
.ver-row:last-child {
  border-bottom: 0;
}
.ver-main {
  min-width: 0;
}
.ver-title {
  display: block;
  font-weight: 600;
}
.ver-main .refined-sub {
  margin-top: 1px;
}
.ver-row .chip {
  white-space: nowrap;
}

/* ============ 11. Status rail & ops ============ */
.status-rail {
  margin-bottom: 26px;
}
.operating-rail {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}
.rail-chip {
  min-width: 0;
  min-height: 54px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 10px 12px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  background: var(--raised);
  color: var(--text);
  text-align: left;
  box-shadow: none;
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease), transform var(--motion-standard) var(--ease-spring);
}
.rail-chip:hover {
  background: var(--muted-surface);
  border-color: var(--border);
  transform: translateY(-1px);
}
.rail-chip:active {
  transform: scale(0.98);
}
.rail-chip-ring {
  display: inline-grid;
  place-items: center;
}
.rail-chip-copy {
  min-width: 0;
  display: grid;
  gap: 1px;
}
.rail-chip-label {
  color: var(--text-3);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.rail-chip-value {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.rail-chip-note {
  color: var(--text-3);
  font-size: 11.5px;
  white-space: nowrap;
}
.system-chip.ok {
  border-color: color-mix(in srgb, var(--positive) 24%, var(--border-subtle));
}
.system-chip.warn {
  border-color: color-mix(in srgb, var(--warning) 34%, var(--border-subtle));
}
.system-chip.bad {
  border-color: color-mix(in srgb, var(--danger) 34%, var(--border-subtle));
}
.rail-card {
  padding: 10px 12px;
  align-self: stretch;
  align-content: start;
  height: 100%;
}
.rail-title {
  font-size: 11.5px;
  color: var(--text-3);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.rail-value {
  font-weight: 600;
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
}
.ops-card {
  min-height: 74px;
  cursor: pointer;
  text-align: left;
  width: 100%;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease);
}
.ops-card:hover {
  background: var(--muted-surface);
  border-color: var(--border);
}
.ops-card .rail-title {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  min-height: 18px;
}
.machine-strip,
.sync-strip {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.machine-chip,
.sync-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: var(--tag-gray-bg);
  border-radius: var(--r-sm);
  padding: 2px 7px;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text-2);
  font-weight: 500;
}
.ops-detail-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.ops-list {
  display: grid;
  gap: 0;
}
.ops-row {
  display: grid;
  grid-template-columns: 140px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 9px 8px;
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
}
.ops-row:last-child {
  border-bottom: 0;
}
.prompt-snippet {
  color: var(--text-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rail-summary {
  display: none;
}
.rail-sum-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.momentum-card {
  overflow: hidden;
}
.momentum-head {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  align-items: flex-start;
  margin-bottom: 10px;
}
.momentum-summary {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 10px;
  color: var(--text-2);
  font-size: 12.5px;
}
.momentum-summary span {
  display: inline-flex;
  align-items: center;
  gap: 0;
}
.stat-chips {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 10px 0 14px;
}
.stat-chip {
  border: 1px solid var(--border-subtle);
  background: var(--raised);
  border-radius: var(--r-md);
  padding: 8px 10px;
  text-align: left;
  color: var(--text);
  transition: background var(--fast) var(--ease), border-color var(--fast) var(--ease);
}
.stat-chip:hover {
  background: var(--subtle);
  border-color: var(--border);
}
.stat-chip .v {
  font-weight: 600;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}
.stat-chip .l {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 1px;
}
.boot-status {
  margin-top: 12px;
  color: var(--text-2);
}
.boot-proj {
  opacity: 0.85;
}

/* ============ 12. Usage & charts ============ */
.credit-card {
  cursor: pointer;
  text-align: left;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
  border: 1px solid var(--border-subtle);
  background: var(--raised);
  border-radius: var(--r-lg);
  padding: 10px 12px;
  box-shadow: none;
  align-self: stretch;
  align-content: start;
  height: 100%;
  transition: background var(--fast) var(--ease),
    border-color var(--fast) var(--ease);
}
.credit-card:hover {
  background: var(--muted-surface);
  border-color: var(--border);
}
.credit-mini {
  display: grid;
  gap: 7px;
  margin-top: 8px;
}
.credit-mini-row {
  display: grid;
  grid-template-columns: 74px minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
}
.credit-name {
  font-weight: 600;
  color: var(--text);
  font-size: 12px;
}
.credit-amt {
  font-size: 11.5px;
  color: var(--text-2);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.credit-age {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 6px;
}
.creditbar {
  height: 4px;
  border-radius: var(--pill);
  background: var(--subtle);
  overflow: hidden;
}
.creditbar i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--brand);
  transition: width var(--standard) var(--ease);
}
.creditbar.anthropic i,
.creditbar.claude i {
  background: var(--anthropic-focus);
}
.creditbar.gpt i,
.creditbar.openai i {
  background: var(--gpt-blue);
}
.creditbar.codex i {
  background: var(--openai-green);
}
.creditbar.cursor i {
  background: var(--cursor-black);
}
.creditbar.local i {
  background: var(--positive);
}
.creditbar.hot i {
  background: var(--danger);
}
.creditbar.no-data {
  background: repeating-linear-gradient(
    45deg,
    var(--subtle) 0 6px,
    transparent 6px 12px
  );
  opacity: 0.6;
}
.creditbar.no-data i {
  display: none;
}
.usage-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  align-items: stretch;
}
.usage-card {
  padding: 14px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-lg);
  background: var(--raised);
  height: 100%;
}
.usage-card h3 {
  display: flex;
  align-items: center;
  gap: 8px;
}
.usage-big {
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.usage-window,
.usage-full {
  grid-column: 1/-1;
}
.usage-window {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.usage-window .seg {
  justify-content: flex-end;
}
.mix-row {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr) 56px;
  gap: 10px;
  align-items: center;
  margin: 8px 0;
}
.mix-label {
  font-weight: 600;
}
.mix-label .brand-label {
  font-size: 13px;
}
.mix-sub {
  font-size: 11.5px;
  color: var(--text-3);
}
.usage-table {
  display: grid;
  gap: 0;
}
.usage-table-row {
  display: grid;
  grid-template-columns: 1fr 0.8fr 0.8fr 0.8fr 0.7fr;
  gap: 10px;
  padding: 8px;
  border: 0;
  border-bottom: 1px solid var(--border-subtle);
  border-radius: 0;
  background: transparent;
  font-size: 12.5px;
  align-items: center;
  transition: background var(--fast) var(--ease);
}
.usage-table-row.head {
  border-bottom: 1px solid var(--border-subtle);
  background: transparent;
  color: var(--text-3);
  font-weight: 500;
}
.usage-table-row:last-child:not(.head) {
  border-bottom: 0;
}
/* Six columns: project, tokens, lane, then the three cost measures kept
   visually separate so billed and saved are never read as one number. */
.project-cost-table .usage-table-row {
  grid-template-columns: 1.4fr 0.7fr 0.9fr 0.8fr 0.8fr 0.8fr;
}
.recent-sessions-table .usage-table-row {
  grid-template-columns: 1.2fr 0.75fr 1fr 1fr 1fr 1fr 1fr 0.7fr 0.6fr 0.7fr;
}
.recent-sessions-table .usage-table-row:not(.head) {
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.recent-sessions-table .usage-table-row:not(.head):hover {
  background: var(--subtle);
}
.session-summary {
  display: block;
  margin-top: 2px;
  font-size: 11.5px;
  font-weight: 400;
  color: var(--text-3);
  line-height: 1.4;
}
.session-projects {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}
.session-proj-chip {
  display: inline-block;
  padding: 1px 6px;
  border-radius: var(--r-sm);
  background: var(--tag-gray-bg);
  border: 0;
  font-size: 10.5px;
  font-weight: 500;
  color: var(--tag-gray-text);
  white-space: nowrap;
}
.session-detail-row {
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr);
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border-subtle);
  font-size: 13.5px;
  overflow-wrap: anywhere;
}
.session-detail-row:last-child {
  border-bottom: none;
}
.session-route {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  flex-wrap: wrap;
}
.route-arrow {
  color: var(--text-3);
  font-weight: 600;
  margin: 0 2px;
}
.cost-inline {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.cost-link {
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--text);
  font: inherit;
  font-weight: 600;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  cursor: pointer;
}
.cost-link:hover {
  color: var(--brand);
}
.cost-savings {
  color: var(--positive-deep);
  font-weight: 600;
}
/* The inverse of cost-savings: a delegation that cost more than it should
   have (same-tier-or-up), not less. */
.cost-warning {
  color: var(--warning);
  font-weight: 600;
}
/* A plan-seat figure is arithmetic, not money. Muted and never bold, so it
   never reads with the same weight as a lane that actually bills. */
.cost-notional {
  color: var(--text-2);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
/* The seat fee actually paid, amortized — real money, so it reads like it. */
.cost-plan-share {
  display: block;
  color: var(--text);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
/* Per-lane project cost. Markdown cannot make a column primary; CSS can, so
   Cost gets real weight, size and color here rather than the position-only
   emphasis the terminal digest has to settle for. */
.cost-lanes {
  display: flex;
  flex-direction: column;
  margin: 10px 0 4px;
}
.cost-lane {
  display: grid;
  grid-template-columns: 1.5fr 1fr 0.8fr 0.8fr 0.9fr;
  gap: 10px;
  align-items: baseline;
  padding: 7px 2px;
  border-bottom: 1px solid var(--border-subtle);
}
.cost-lane.head {
  font-size: 12px;
  color: var(--text-2);
  border-bottom-color: var(--text-3);
}
.cost-lane.total {
  border-bottom: none;
  border-top: 2px solid var(--text-3);
  margin-top: 4px;
  padding-top: 9px;
  font-weight: 600;
}
.cost-lane-model {
  color: var(--text-2);
  font-size: 13px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cost-lane-num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
}
.cost-lane-num.saved {
  color: var(--positive-deep);
}
/* The primary figure: heavier, larger, full-contrast. */
.cost-lane-num.cost {
  color: var(--text);
  font-weight: 700;
  font-size: 15px;
}
.cost-lane.head .cost-lane-num.cost {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
}

.cost-measures {

}
.cost-measure {

}
.cost-measure-label {

}
.cost-measure-value {

}

}
.brand-label {

  align-items: center;
  gap: 7px;
  min-width: 0;
  font-weight: 600;
  color: var(--text);
}
.brand-label.local,
.brand-label.opencode,
.brand-label.cursor {
  color: var(--text);
}
.brand-icon {
  width: 18px;
  height: 18px;
  border-radius: var(--r-sm);
  display: inline-grid;
  place-items: center;
  flex: 0 0 18px;
  background: var(--muted-surface);
  border: 1px solid var(--border-subtle);
  overflow: hidden;
}
.brand-icon img {
  width: 13px;
  height: 13px;
  object-fit: contain;
  display: block;
}
.brand-icon.vscode img {
  width: 15px;
  height: 15px;
}
.brand-icon.cursor {
  background: #37352f;
  border-color: #37352f;
}
.brand-icon.cursor img {
  filter: invert(1);
}
.brand-icon.anthropic {
  background: var(--anthropic-ivory);
  border-color: var(--border-subtle);
}
.brand-icon.openai,
.brand-icon.vscode {
  background: var(--muted-surface);
  border-color: var(--border-subtle);
}
.brand-icon.neutral::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-3);
}
.brand-icon.local {
  background: var(--positive-soft);
  border-color: var(--border-subtle);
  color: var(--positive);
}
/* Third harness. No vendor asset to inline, so it reads as a neutral chip —
   distinct from Claude Code and Cursor without inventing a logo. */
.brand-icon.opencode {
  background: var(--muted-surface);
  border-color: var(--text-3);
}
.brand-icon.local img {
  width: 12px;
  height: 12px;
}
.usage-table-row .brand-label {
  font-weight: 600;
}
.usage-table-row .brand-icon {
  width: 16px;
  height: 16px;
  flex-basis: 16px;
  border-radius: var(--r-xs);
}
.usage-table-row .brand-icon img {
  width: 11px;
  height: 11px;
}

/* ============ 13. Modals, toast, misc ============ */
.modal-scrim,
.sheet-scrim {
  position: fixed;
  inset: 0;
  background: rgba(15, 15, 15, 0.55);
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 24px;
  animation: backdrop-in 120ms var(--ease);
}
.modal-card {
  width: min(840px, 100%);
  max-height: min(86vh, 900px);
  overflow: auto;
  padding: 24px;
  box-shadow: var(--shadow-md);
  border: 0;
  scrollbar-gutter: stable;
  animation: modal-in 120ms var(--ease);
}
.modal-wide {
  width: min(1120px, 100%);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  align-items: flex-start;
}
.modal-head p {
  margin: 4px 0 0;
  color: var(--text-2);
}
.modal-head h2 {
  letter-spacing: -0.01em;
}
.modal-scrim.closing {
  animation: backdrop-in var(--fast) var(--ease) reverse forwards;
  pointer-events: none;
}
.modal-scrim.closing .modal-card {
  animation: modal-in var(--fast) var(--ease) reverse forwards;
}
@keyframes backdrop-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes modal-in {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: max-content;
  max-width: calc(100vw - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  background: #37352f;
  color: #fff;
  padding: 8px 14px;
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  font-size: 14px;
  z-index: 80;
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--standard) var(--ease);
}
[data-theme="dark"] .toast {
  background: #2f2f2f;
  color: rgba(255, 255, 255, 0.9);
}
.toast.show {
  opacity: 1;
  pointer-events: auto;
}
.toast.instant {
  transition: none;
}
@media (prefers-reduced-motion: reduce) {
  .toast {
    transition: none;
  }
}
.toast.success {
  background: var(--positive-deep);
}
.toast.warning {
  background: #8a5a10;
}
.toast.danger {
  background: var(--danger);
}
.toast.info {
  background: var(--brand-hover);
}
.toast-action {
  border: 0;
  background: transparent;
  color: #fff;
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  margin-left: 10px;
  padding: 2px 4px;
  cursor: pointer;
}
.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.86);
  z-index: 70;
  display: grid;
  place-items: center;
  padding: 24px;
}
.lightbox img {
  max-width: 92vw;
  max-height: 82vh;
  border-radius: var(--r-md);
}
.doc-frame-wrap {
  height: min(74vh, 900px);
}
.doc-frame {
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: var(--r-lg);
  background: #fff;
}
.filter-sheet-list .refined-title {
  text-transform: capitalize;
}
[aria-disabled="true"],
.disabled {
  opacity: 0.5;
  pointer-events: none;
}

/* ============ 14. Motion & states ============ */
/* reveal: a subtle 120ms fade, no travel */
@keyframes wb-fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
.reveal {
  animation: wb-fade-in 120ms var(--ease) both;
  animation-delay: var(--stagger, 0ms);
}
/* pressable / vibe-press / vibe-hover: background tints only — no scale */
.pressable {
  transition: background var(--fast) var(--ease),
    border-color var(--fast) var(--ease), color var(--fast) var(--ease);
}
.pressable:active,
.pressable.vibe-press,
.vibe-press {
  background-color: var(--subtle);
}
.btn.primary.pressable:active,
.btn.primary.vibe-press {
  background-color: var(--brand-hover);
}
.btn.danger.pressable:active,
.btn.danger.vibe-press {
  background-color: var(--danger-hover);
}
.interactive-lift {
  transition: background var(--fast) var(--ease),
    border-color var(--fast) var(--ease);
}
.interactive-lift:hover,
.interactive-lift.vibe-hover {
  border-color: var(--border);
}
.interactive-lift:active,
.interactive-lift.vibe-press {
  background-color: var(--subtle);
}
.vibe-ready .card,
.vibe-ready .project-tile {
  will-change: background-color, border-color;
}
.btn.loading,
.iconbtn.loading,
.btn[aria-busy="true"],
.iconbtn[aria-busy="true"] {
  position: relative;
  color: transparent !important;
  pointer-events: none;
}
.btn.loading::after,
.iconbtn.loading::after,
.btn[aria-busy="true"]::after,
.iconbtn[aria-busy="true"]::after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-top-color: transparent;
  color: var(--text-2);
  animation: spin 800ms linear infinite;
}
.btn.primary.loading::after {
  color: #fff;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes wb-shimmer {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}
.skeleton {
  background: linear-gradient(
    90deg,
    var(--subtle),
    var(--muted-surface),
    var(--subtle)
  );
  background-size: 200% 100%;
  animation: wb-shimmer 1.4s linear infinite;
  border-radius: var(--r-sm);
}
.btn:focus-visible,
.iconbtn:focus-visible,
.qrow:focus-visible,
.table-row:focus-visible,
.task-row:focus-visible,
.kb-row:focus-visible,
.refined-row:focus-visible,
.project-tile:focus-visible,
.nav button:focus-visible,
.mobile-tabs button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* ============ 15. Markdown (reading view) ============ */
.markdown {
  font-size: 16px;
  line-height: 1.6;
  max-width: 44rem;
}
.markdown h1,
.markdown h2,
.markdown h3 {
  margin: 20px 0 8px;
}
.markdown p {
  margin: 0 0 10px;
}
.markdown table {
  border-collapse: collapse;
  width: 100%;
  margin: 12px 0;
  font-size: 14.5px;
}
.markdown td,
.markdown th {
  border: 1px solid var(--border-subtle);
  padding: 6px 10px;
  text-align: left;
}
.markdown th {
  color: var(--text-2);
  font-weight: 500;
  background: var(--muted-surface);
}
.markdown code {
  font-family: var(--font-mono);
}
.markdown blockquote {
  margin: 12px 0;
  padding: 2px 0 2px 14px;
  border-left: 3px solid var(--text);
  color: var(--text-2);
}

/* Equal-height card rows */
.grid,
.status-rail,
.usage-grid,
.gallery,
.ops-detail-grid,
.metric-grid {
  align-items: stretch;
}
.grid > .card,
.grid > .panel,
.grid > .project-tile,
.status-rail > .rail-card,
.usage-grid > .usage-card,
.gallery > .project-tile,
.ops-detail-grid > .usage-card,
.metric-grid > .metric-card {
  height: 100%;
  align-self: stretch;
  align-content: start;
}


/* ============ 15b. KnowsMore operating-site adapter ============ */
.nav-group-title {

}

}

}

}
.main {

}
.trace-stamp {
