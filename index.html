}
.hub-page { max-width: 1600px; margin: 0 auto; }
.hub-header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 20px 0 34px; }
.hub-header h1 { margin: 0; font-size: clamp(36px, 4vw, 60px); line-height: 1.08; letter-spacing: -.045em; color: var(--text-strong); }
.hub-date, .hub-subtitle { color: var(--text-secondary); line-height: 1.5; }
.hub-date { margin: 0 0 12px; font-size: 14px; }
.hub-subtitle { margin: 18px 0 0; max-width: 55ch; }
.hub-layout { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr); gap: clamp(24px, 4vw, 60px); }
.hub-main, .hub-aside { min-width: 0; }
.hub-section { padding: 26px 0; border-top: 1px solid var(--border-subtle); }
.hub-section h2 { margin: 0; font-size: 20px; line-height: 1.25; color: var(--text-strong); }
.hub-section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.hub-row, .hub-host { display: flex; width: 100%; text-align: left; align-items: center; gap: 14px; min-height: 64px; padding: 14px 8px; border: 0; border-bottom: 1px solid var(--border-subtle); background: transparent; color: var(--text-primary); cursor: pointer; font: inherit; }
.hub-row:hover, .hub-host:hover { background: var(--surface-hover, var(--surface-card)); }
.hub-row:focus-visible, .hub-host:focus-visible, .hub-filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hub-row > span, .hub-host > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.hub-row strong, .hub-host strong { display: block; font-size: 14px; line-height: 1.45; font-weight: 600; color: var(--text-strong); }
.hub-row small, .hub-host small { display: block; font-size: 12px; line-height: 1.6; margin-top: 4px; color: var(--text-secondary); }
.hub-row time { color: var(--text-secondary); font-size: 12px; white-space: nowrap; }
.hub-row > svg { flex: none; }
.hub-empty { color: var(--text-secondary); line-height: 1.6; font-size: 14px; max-width: 60ch; }
.hub-source { color: var(--text-secondary); font-size: 12px; line-height: 1.6; margin-top: 16px; }
.hub-filters { display: flex; gap: 4px; flex-wrap: wrap; }
.hub-filters button { padding: 10px 14px; min-height: 44px; border: 1px solid transparent; border-radius: var(--radius-sm); font: inherit; font-size: 13px; background: transparent; color: var(--text-secondary); cursor: pointer; }
.hub-filters button[aria-pressed="true"] { background: var(--surface-card); border-color: var(--border-subtle); color: var(--text-strong); }
.hub-task { padding: 4px 0; }
.hub-overdue { display: block; padding: 0 14px 8px 44px; color: var(--unfav-ink, var(--text-strong)); }
@media (max-width: 1100px) { .hub-layout { grid-template-columns: 1fr; } .hub-aside { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; } }
@media (max-width: 600px) { .hub-header { align-items: flex-start; flex-direction: column; } .hub-aside { display: block; } .hub-row time { display: none; } }
/* In progress: one block per active work session (Tools/Progress writer),
   shown near the top of the home screen. Hidden entirely when state.machines
   carries no sessionProgress rows -- see InProgressSection(). */
.in-progress-section { padding-top: 6px; }
.in-progress-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.ip-card { border: 1px solid var(--border-subtle); border-radius: var(--radius-md, 10px); background: var(--surface-card); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ip-card.is-stale { border-color: var(--warn); box-shadow: 0 0 0 1px color-mix(in srgb, var(--warn) 25%, transparent); }
.ip-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.ip-title { font-size: 14px; font-weight: 600; color: var(--text-strong); line-height: 1.35; overflow-wrap: anywhere; }
.ip-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.ip-bar-track { height: 8px; border-radius: 99px; background: var(--surface-inset); overflow: hidden; }
.ip-bar-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width var(--motion-emphasized, .3s ease) var(--ease-settle, ease); }
.ip-bar-meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-muted); margin-top: 4px; font-variant-numeric: tabular-nums; gap: 8px; }
.ip-note { font-size: 12.5px; color: var(--text-secondary); line-height: 1.5; margin: 0; }
.ip-todo { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.ip-todo li { display: flex; align-items: flex-start; gap: 6px; font-size: 12.5px; color: var(--text-secondary); line-height: 1.4; }
.ip-todo li.done { color: var(--text-muted); text-decoration: line-through; }
.ip-todo-marker { flex: none; margin-top: 1px; color: var(--text-muted); }
.ip-todo li.done .ip-todo-marker { color: var(--fav); }
.ip-footer { font-size: 11.5px; color: var(--text-muted); display: flex; flex-wrap: wrap; gap: 10px; }
.ip-link { color: var(--accent-ink, var(--accent)); text-decoration: none; }
.ip-link:hover { text-decoration: underline; }
@media (max-width: 420px) { .in-progress-grid { grid-template-columns: 1fr; } }

  .focus-split-brief[data-expanded="true"] .focus-split-brief-details[aria-hidden="true"] { display: none; }
  .focus-split-date { margin: 0 0 10px; font-size: 12px; }
  .focus-split-brief h1 { max-width: 18ch; font-size: 24px; }
  .focus-split-intro { margin-top: 8px; font-size: 13px; }
  .focus-split-priorities { margin-top: 18px; }
  .focus-split-priorities h2 { font-size: 14px; }
  .focus-split-brief-footer { gap: 16px; margin-top: 18px; padding-top: 0; }
  .focus-split-workspace { min-width: 0; }
  .focus-split-nav {
    position: sticky;
    top: 112px;
    z-index: 19;
    width: calc(100% - 24px);
    margin: 0 12px;
    gap: 0;
    background: var(--surface-page);
    overscroll-behavior-x: contain;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .focus-split-nav::-webkit-scrollbar { display: none; }
  .focus-split-nav button { min-height: 50px; padding: 0 12px; font-size: 13px; white-space: nowrap; }
  .focus-split-return { min-height: 50px; margin: 0 12px; }
  .focus-split-content .hub-header h1 { font-size: 27px; }
  .focus-split-content .hub-aside { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .focus-split-indicator, .focus-split-priority > svg { transition-duration: 1ms; transform: none; }
  .focus-split-nav { scroll-behavior: auto; }
}

  <div id="wbBootOverlay" class="wb-boot-overlay" role="status" aria-live="polite" aria-busy="true">
    <div class="wb-boot-card">
      <span class="wb-boot-spinner" aria-hidden="true"></span>
      <div class="wb-boot-wordmark">Workbench</div>
      <div class="wb-boot-status" id="wbBootStatus">Starting…</div>
    </div>
  </div>
  <main id="landing" class="auth-screen" aria-labelledby="landingTitle">
    <div class="auth-panel">
      <div class="brand auth-brand"><span class="wordmark">Workbench</span></div>
      <h1 id="landingTitle">Sign in to Workbench</h1>
      <p class="lede" id="landingNote">Open your private workspace with GitHub. Workbench remembers your sign-in on this browser.</p>
      <button class="btn primary auth-submit" id="sbSignIn">Continue with GitHub</button>
      <p class="auth-footnote">Your repository stays private. You can sign out from Workbench at any time.</p>
    </div>
  </main>

  <!-- React owns the connected shell (DesktopShell / MobileShell). Legacy markup
       here caused the mobile CSS frame to flash or persist when the React tree
       failed to mount, and bindShell threw on missing #syncBtn after mount. -->
  <div id="app" class="hidden"></div>
  <script>
  (function () {
    try {
      var saved = JSON.parse(localStorage.getItem("workbench-sb-session") || "null");
      if (saved && saved.access_token && (location.protocol === "file:" || location.protocol.startsWith("http"))) {
        document.documentElement.classList.add("wb-autoconnect");
        var landing = document.getElementById("landing");
        var app = document.getElementById("app");
        if (landing) landing.classList.add("hidden");
        if (app) app.classList.remove("hidden");
        var status = document.getElementById("wbBootStatus");
        if (status) status.textContent = "Opening your workspace…";
      }
    } catch (e) {}
  })();
  </script>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  // Service worker registration. HTTPS (or localhost) only -- registration
  // throws on file:, and the dashboard's only supported surface is the Pages
  // site, so a failure here is logged and ignored rather than blocking boot.
  // ?nosw=1 unregisters and clears every cache: the recovery path if a bad
  // build ever gets installed on the home-screen PWA.
  (function () {
    if (!("serviceWorker" in navigator)) return;
    var params = new URLSearchParams(location.search);
    if (params.has("nosw")) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { r.unregister(); });
      });
      if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
      return;
    }
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;
    // sw.js posts wb-updated when a newer build is cached behind the one on
    // screen. Offer the reload rather than swapping the page under the user.
    navigator.serviceWorker.addEventListener("message", function (e) {
      if (!e.data || e.data.type !== "wb-updated") return;
      var t = document.getElementById("toast");
      if (!t) return;
      t.textContent = "Updated \u2014 ";
      var b = document.createElement("button");
      b.className = "toast-action";
      b.textContent = "reload";
      b.onclick = function () { location.reload(); };
      t.appendChild(b);
      // "instant" skips the fade: a throttled or backgrounded tab never
      // advances the opacity transition, which left the toast at opacity 0.
      t.className = "toast show instant";
      clearTimeout(t._to);
      t._to = setTimeout(function () { t.classList.remove("show"); }, 12000);
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function () {
        return navigator.serviceWorker.ready;
      }).then(function (reg) {
        // Ask the worker whether a newer build is already cached: a reload's
        // revalidation can finish before this page exists to hear about it.
        var w = navigator.serviceWorker.controller || reg.active;
        if (w) w.postMessage({ type: "wb-check", version: "2026-10-26.22" });
      }).catch(function (e) {
        console.warn("service worker registration failed", e);
      });
    });
  })();

  <script>
  (function(){
    const params=new URLSearchParams(location.search);
    let returning=false;
    try{returning=sessionStorage.getItem('wb-briefing-return')==='1'}catch{}
    if(params.get('view')!=='daily-briefing'&&!returning)return;
    if(returning){
      try{sessionStorage.removeItem('wb-briefing-return')}catch{}
      history.replaceState(null,'',location.pathname+'?view=daily-briefing');
    }
    document.documentElement.classList.add('wb-daily-review');
    const root=document.createElement('main');root.id='wbDailyReview';
    root.innerHTML='<div class="daily-shell"><header class="daily-mast"><span>Workbench Daily</span><a href="./">Back to dashboard</a></header><section class="daily-intro"><div><h1>Review before print</h1><p>Update the work list, then print the full briefing.</p></div><button id="dailyPrint" class="daily-primary" type="button" disabled>Print reviewed briefing</button></section><div id="dailyMessage" class="daily-message" role="status" aria-live="polite"></div><div id="dailyBody"></div></div>';
    document.body.append(root);
    const byId=id=>document.getElementById(id),auth=window.WBSupabaseAuth;
    let source=null,rows=[],busy=false;
    function node(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!=null)n.textContent=value;return n}
    function say(value){byId('dailyMessage').textContent=value||''}
    async function api(path,method='GET',body){
      if(!auth?.hasSession?.()||!await auth.ensureFresh?.())throw Error('Sign in with GitHub to review the briefing.');
      const cfg=auth.config(),headers={apikey:cfg.anonKey,Authorization:'Bearer '+auth.accessToken(),Accept:'application/json'};
      if(body!==undefined){headers['Content-Type']='application/json';headers.Prefer='return=representation'}
      const response=await fetch(cfg.url+'/rest/v1/'+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
      if(!response.ok)throw Error('Briefing review request failed ('+response.status+').');
      return response.status===204?[]:await response.json();
    }
    function formField(label,value,max,required,multiline){
      const wrap=node('label','',label),field=node(multiline?'textarea':'input');
      field.value=value||'';field.maxLength=max;field.required=!!required;if(multiline)field.rows=2;
      wrap.append(field);return{wrap,field};
    }
    function editForm(row,action){
      document.querySelectorAll('#wbDailyReview .daily-row .daily-form').forEach(n=>n.remove());
      const host=byId('daily-task-'+row.task_id);if(!host)return;
      const form=node('form','daily-form');
      const task=formField('Task',row.task,500,true,false),why=formField('Context',row.why,1000,false,true);
      const reason=formField(action==='complete'?'Why is this complete?':'Why change it? (optional)','',1000,action==='complete',true);
      if(action==='edit')form.append(task.wrap,why.wrap);
      form.append(reason.wrap);
      const buttons=node('div'),save=node('button','daily-primary',action==='complete'?'Mark complete':'Save change'),cancel=node('button','daily-text','Cancel');
      save.type='submit';cancel.type='button';cancel.onclick=()=>form.remove();buttons.append(save,cancel);form.append(buttons);
      form.onsubmit=async event=>{
        event.preventDefault();if(busy)return;busy=true;save.disabled=true;say('');
        try{
          const path='daily_briefing_tasks?owner_uid=eq.'+encodeURIComponent(row.owner_uid)+'&briefing_date=eq.'+row.briefing_date+'&task_id=eq.'+encodeURIComponent(row.task_id)+'&revision=eq.'+row.revision;
          const changes=action==='complete'?{status:'closed',review_reason:reason.field.value.trim()}:
            {task:task.field.value.trim(),why:why.field.value.trim(),review_reason:reason.field.value.trim()||'Edited during briefing review'};
          const result=await api(path,'PATCH',changes);
          if(!result.length)throw Error('This list changed on another device. Reload and try again.');
          await load();say('Saved. The correction is available for the next briefing audit.');
        }catch(error){say(error.message);save.disabled=false}finally{busy=false}
      };
      host.append(form);reason.field.focus();
    }
    async function reopen(row){
      if(busy)return;busy=true;say('');
      try{
        const path='daily_briefing_tasks?owner_uid=eq.'+encodeURIComponent(row.owner_uid)+'&briefing_date=eq.'+row.briefing_date+'&task_id=eq.'+encodeURIComponent(row.task_id)+'&revision=eq.'+row.revision;
        const result=await api(path,'PATCH',{status:'open',review_reason:'Reopened during briefing review'});
        if(!result.length)throw Error('This list changed on another device. Reload and try again.');
        await load();say('Task reopened.');
      }catch(error){say(error.message)}finally{busy=false}
    }
    function taskRow(row,closed){
      const outer=node('article','daily-row');outer.id='daily-task-'+row.task_id;
      const head=node('div','daily-row-head'),main=node('div','daily-row-main'),actions=node('div','daily-actions');
      main.append(node('strong','',row.task));
      main.append(node('div','daily-meta',(row.source_kind==='project'?(row.project||'Project'):row.task_id)+(row.why?' · '+row.why:'')));
      if(closed){if(row.review_reason)main.append(node('div','daily-meta','Completed: '+row.review_reason));
        const reopenButton=node('button','daily-text','Reopen');reopenButton.onclick=()=>reopen(row);actions.append(reopenButton)}
      else{const complete=node('button','daily-text','Complete'),edit=node('button','daily-text','Edit');
        complete.onclick=()=>editForm(row,'complete');edit.onclick=()=>editForm(row,'edit');actions.append(complete,edit)}
      head.append(main,actions);outer.append(head);return outer;
    }
    function render(){
      const body=byId('dailyBody');body.replaceChildren();
      const open=rows.filter(r=>r.status==='open'),closed=rows.filter(r=>r.status==='closed');
      const heading=node('div','daily-section');heading.append(node('h2','','Outstanding work'),node('span','',open.length+' open'));body.append(heading);
      if(!open.length)body.append(node('p','','No outstanding work. Add a task below if something is missing.'));
      for(const row of open)body.append(taskRow(row,false));
      const add=node('form','daily-form daily-add');add.append(node('h2','','Add missing work'));
      const task=formField('Task','',500,true,false),why=formField('Context','',1000,false,true),reason=formField('Why was it missed? (optional)','',1000,false,false);
      const save=node('button','daily-primary','Add to briefing');save.type='submit';add.append(task.wrap,why.wrap,reason.wrap,save);
      add.onsubmit=async event=>{
        event.preventDefault();if(busy)return;busy=true;save.disabled=true;say('');
        try{
          const row={owner_uid:auth.userId(),briefing_date:source.briefing_date,task_id:'R'+crypto.randomUUID().replace(/-/g,''),
            source_kind:'manual',order_index:Math.max(-1,...rows.map(r=>r.order_index))+1,
            task:task.field.value.trim(),why:why.field.value.trim(),status:'open',review_reason:reason.field.value.trim()||'Added during briefing review'};
          await api('daily_briefing_tasks','POST',row);await load();say('Task added to the reviewed briefing.');
        }catch(error){say(error.message);save.disabled=false}finally{busy=false}
      };body.append(add);
      const done=node('div','daily-section');done.append(node('h2','','Completed in review'),node('span','',closed.length+' completed'));body.append(done);
      for(const row of closed)body.append(taskRow(row,true));
      body.append(node('p','daily-meta','Project task changes update this briefing. The correction audit checks their source plans separately.'));
      byId('dailyPrint').disabled=false;
    }
    async function load(){
      if(!auth?.hasSession?.()){
        const body=byId('dailyBody');body.replaceChildren();const p=node('p','','Sign in with GitHub to review the private briefing.');
        const button=node('button','daily-primary','Sign in with GitHub');
        button.onclick=()=>{try{sessionStorage.setItem('wb-briefing-return','1')}catch{}auth.signIn()};
        body.append(p,button);return;
      }
      say('Loading the private briefing…');
      try{
        const docs=await api('daily_briefing_documents?select=briefing_date,source_html&order=briefing_date.desc&limit=1');
        if(!docs.length){byId('dailyBody').replaceChildren(node('p','','No daily briefing has been published for review yet.'));say('');return}
        source=docs[0];rows=await api('daily_briefing_tasks?select=owner_uid,briefing_date,task_id,source_kind,project,order_index,task,why,status,review_reason,revision&briefing_date=eq.'+source.briefing_date+'&order=order_index.asc');
        render();say('');
      }catch(error){say(error.message);byId('dailyBody').replaceChildren(node('p','','Review is unavailable. Please try again.'))}
    }
    function printReviewed(){
      if(!source)return;
      const doc=new DOMParser().parseFromString(source.source_html,'text/html');
      doc.querySelectorAll('script,iframe,object,embed').forEach(n=>n.remove());
      const work=doc.querySelector('[data-briefing-work]'),list=work?.querySelector('ol');
      if(!list){say('The printable briefing is missing its work section.');return}
      for(const child of [...work.children])if(child!==list&&child.tagName!=='H2')child.remove();
      list.replaceChildren();
      for(const row of rows.filter(r=>r.status==='open')){
        const li=doc.createElement('li'),box=doc.createElement('span'),p=doc.createElement('p'),label=doc.createElement('span'),meta=doc.createElement('span');
        box.className='box';box.setAttribute('aria-hidden','true');p.className='task-text';
        label.className='task-meta';label.textContent=row.source_kind==='project'?row.project||'':row.task_id;
        meta.className='task-meta';meta.textContent=row.why||'';
        p.append(label,doc.createTextNode(' '+row.task),meta);li.append(box,p);list.append(li);
      }
      const popup=window.open('','_blank');if(!popup){say('Allow pop-ups to open the print copy.');return}
      popup.addEventListener('load',()=>popup.print(),{once:true});
      popup.document.open();popup.document.write('<!doctype html>'+doc.documentElement.outerHTML);popup.document.close();
    }
    byId('dailyPrint').onclick=printReviewed;
    window.addEventListener('workbench-auth-change',load);
    load();
  })();
  </script>
</body>
</html>
